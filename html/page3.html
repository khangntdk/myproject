<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tính diện tích</title>
</head>
<body>
	<p id="name">
		Duy Khang
	</p>
	<button type="button" onclick="Math()">Math</button>
	<script>
		function Math(){
		let	b ;
		let a ;
		b = Number(prompt("Nhập chiều dài"));
		do{
		
			
			a = Number(prompt("Nhập chiều rộng"));
		}while(a>b);

		if(a=b)
		{
			alert(`diện tích hình vuông là: ${a*b}`);
		} else{
			alert(`diện tích hình chữ nhật là: ${a*b}`);
		}
		}
	</script>
</body>
</html>
