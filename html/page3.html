<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Tính diện tích</title>


	<style>
		body{
			font-family: Arial, sans-serif;
			background-color: #f4f4f4;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
		}

		#name{
			font-size: 32px;
			font-weight: bold;
			color: #333;
			margin-bottom: 20px;
		}

		button{
			padding: 12px 25px;
			font-size: 18px;
			border: none;
			border-radius: 8px;
			background-color: #007bff;
			color: white;
			cursor: pointer;
			transition: 0.3s;
		}

		button:hover{
			background-color: #0056b3;
			transform: scale(1.05);
		}
	</style>
</head>
<body>
	<p id="name">
		Duy Khang
	</p>
	<h2>Hãy nhấn để tính diện tích</h2>
	<button type="button" onclick="Math()">Math</button>
	<script>
		function Math(){
		let	b ;
		let a ;
		b = Number(prompt("Nhập chiều dài"));
		do{
		
			
			a = Number(prompt("Nhập chiều rộng"));
		}while(a>b);

		if(a=b)
		{
			alert(`diện tích hình vuông là: ${a*b}`);
		} else{
			alert(`diện tích hình chữ nhật là: ${a*b}`);
		}
		}
	</script>
</body>
</html>
