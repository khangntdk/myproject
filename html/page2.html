<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>hộp thoại alert</title>
</head>
<body>
	<p id="name">
		Duy Khang
	</p>
	<script>
		let name = prompt("Nhập tên của bạn");
		let  yob= Number(prompt("Nhập năm sinh của bạn"));
		alert(" xin chào! "+name+" năm 2026 bạn đã "+(2026-yob)+" rồi đó hihiii");
	</script>
</body>
</html>
