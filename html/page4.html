<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>trang form đăng ký</title>
	<link rel="stylesheet" href="../css/style4.css">
</head>
<body>
    <div class="container">
		<form id="frmLogin">
		<a href="page5.html">
			<h3>
				Đăng nhập
			</h3>
		</a>
		
			<h2>
				Đăng ký
			</h2>
			<div class="form-group">
				<label for="txtUsername" class="username">
					Username:
				</label>
				<input type="text" id="txtUsername" name="txtUsername">
			</div>
			<div class="form-group">
				<label for="email" class="email">
					Email:
				</label>
				<input type="email" id="email" name="email">
			</div>
			
			<div class="form-group">
				<label for="Password" class="password">
					Mật khẩu:
				</label>
				<input type="password" id="Password" name="Password">
			</div>
			
			<div class="form-group">
				<label for="Password" class="password">
					Xác nhận mật khẩu:
				</label>
				<input type="password" id="Password" name="Password">
			</div>
			<div class="container-btn">

				<input class="input" type="submit" name="sblogin" value="Đăng ký">
				<input class="input" type="reset" name="rsCancle" value="Hủy">
			</div>
		</form>
	</div>
</body>
</html>
